name: Validate marketplace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out marketplace with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Exercise catalog generation regressions
        run: python -m unittest discover -s tests -q

      - name: Check generated catalogs, manifests, assets, and secret hygiene
        shell: pwsh
        run: ./scripts/validate-marketplace.ps1
